[package]
name = "oauth-device"
version = "0.1.0"
edition = "2021"
description = "OAuth 2.0 device authorization flow for Rust desktop apps, with a 0600 token file"
license = "MIT"
repository = "https://github.com/janestreetshiller/oauth-device"
keywords = ["oauth", "device-flow", "desktop", "cli"]
categories = ["authentication"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12.1", default-features = false, features = ["tls"] }
